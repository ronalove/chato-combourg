services:
  chato-combourg:
    image: git.ronan.love/ronan/chato-combourg:latest
    # Or build locally:
    # build: .
    ports:
      - "8080:8080"
    volumes:
      # Required: trained YOLO model weights
      - ./models:/app/models:ro

      # Required: Card images (PNG + thumbs)
      - ./cards:/app/cards:ro

      # Required: Python dependencies cache (installed at first startup)
      # First run takes ~5-10 minutes, subsequent starts are instant
      - deps-cache:/app/deps

      # Required: SQLite database and captures
      - ./data:/app/data
    restart: unless-stopped

volumes:
  deps-cache:
