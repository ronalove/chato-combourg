# CI Woodpecker : vérification du front, image vers le registre Gitea sur push main (latest) et sur
# tag v* (auto_tag), puis redéploiement du stack cadence par docker compose depuis l'étape deploy.
# Le plugin buildx est dans WOODPECKER_PLUGINS_PRIVILEGED côté serveur : pas de `privileged` ici.
when:
  - event: [push, tag, manual]

steps:
  check-web:
    image: oven/bun:1.3-slim
    commands:
      - cd frontend
      - bun install --frozen-lockfile
      - bun run build
    when:
      - event: [push, tag, manual]

  build-and-push-main:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: git.ronan.love
      repo: git.ronan.love/ronan/chato-combourg
      platforms: linux/amd64
      tags: latest
      username:
        from_secret: registry_user
      password:
        from_secret: registry_token
    when:
      - event: [push, manual]
        branch: main

  build-and-push-tag:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: git.ronan.love
      repo: git.ronan.love/ronan/chato-combourg
      platforms: linux/amd64
      auto_tag: true
      username:
        from_secret: registry_user
      password:
        from_secret: registry_token
    when:
      - event: tag
        ref: refs/tags/v*

  deploy:
    # Déploiement direct depuis le CI : docker compose sur le socket de cadence. Le dossier du stack
    # est monté au même chemin que sur l'hôte pour que les volumes relatifs (models, cards, data)
    # se résolvent correctement. Nécessite le niveau de confiance « volumes » sur le dépôt Woodpecker.
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/share/stacks/chato-combourg:/home/share/stacks/chato-combourg
    environment:
      REGISTRY_USER:
        from_secret: registry_user
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - 'echo "$REGISTRY_TOKEN" | docker login git.ronan.love -u "$REGISTRY_USER" --password-stdin'
      - cd /home/share/stacks/chato-combourg
      - docker compose --project-name chato-combourg pull --quiet
      - docker compose --project-name chato-combourg up -d --remove-orphans
      - docker compose --project-name chato-combourg ps
    when:
      - event: [push, manual]
        branch: main
